name: Deploy site

on:
  push:
    branches: [main]
    # The1TrueJoe/The1TrueJoe force-pushes this tag once its Pages deploy has
    # published a new resume.json, which is what rebuilds the Résumé section
    # here. It is an annotated tag, so the ref genuinely changes every time and
    # the push event actually fires — and it is a tag, so nothing lands in this
    # repository's commit history.
    tags: [resume-latest]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # `prebuild` runs sync-resume, which fetches the published résumé and
      # falls back to the committed src/data/resume.json if it is unreachable.
      # No token: the résumé is a public file, not an API call.
      - name: Build
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
